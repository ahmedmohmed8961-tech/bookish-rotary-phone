<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple of Fortune</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;color:white;font-family:Arial,Tahoma,sans-serif;
 background:#031d19;
}
.game{
 width:100%;max-width:440px;min-height:100vh;margin:auto;
 padding:15px 12px 20px;
 background:
 radial-gradient(ellipse at 70% 35%,#b2df3450,transparent 30%),
 radial-gradient(ellipse at 20% 20%,#10a69b,transparent 45%),
 linear-gradient(160deg,#053a34,#08776a 55%,#126b31);
 display:flex;flex-direction:column;
}
.header{
 display:flex;align-items:center;justify-content:space-between;
 gap:8px;margin-bottom:8px;
}
.balance{
 background:#06312c;border-radius:25px;
 padding:11px 13px;font-weight:bold;font-size:15px;
}
.plus{
 display:inline-grid;place-items:center;
 width:27px;height:27px;border-radius:50%;
 background:#21c878;font-size:23px;margin-right:5px;
}
.title{text-align:center;font-size:13px;letter-spacing:1px}
.board{display:flex;flex-direction:column;gap:5px;margin-top:15px}
.row{
 display:grid;
 grid-template-columns:80px repeat(5,minmax(0,1fr));
 gap:5px;align-items:center;
}
.mult{
 text-align:center;padding:11px 1px;
 background:#064335;border-radius:12px;
 font-size:12px;color:#c5e5d7;
}
.mult.active{background:#19c96b;color:white;font-weight:bold}
.cell{
 width:100%;aspect-ratio:1;border-radius:50%;
 border:2px solid #356c5e;
 background:linear-gradient(145deg,#a66a40,#57301d);
 box-shadow:inset 0 3px 5px #ffffff25,0 3px 4px #001b1855;
 display:grid;place-items:center;
 padding:0;font-size:clamp(20px,6vw,29px);
 cursor:pointer;overflow:hidden;
}
.cell:disabled{cursor:default}
.cell.apple{
 background:linear-gradient(145deg,#1bc45e,#07522d);
 border-color:#43d780;
}
.cell.core{
 background:linear-gradient(145deg,#963c3c,#511e23);
 border-color:#b95a55;
}
.cell.mushroom{
 background:linear-gradient(145deg,#f8b44d,#a65b1c);
 border-color:#ef9a36;
}
.status{
 background:#03271fdc;border-radius:12px;
 border:1px solid #28644e;
 text-align:center;padding:13px 9px;
 margin-top:15px;font-size:14px;line-height:1.6;
}
button.action{
 width:100%;border-radius:12px;padding:14px;
 font-size:17px;font-weight:bold;margin-top:10px;
 cursor:pointer;
}
.start{background:#4c99e6;color:white;border:0}
.cash{background:#07513d;color:white;border:1px solid #47b985}
button:disabled{opacity:.5;cursor:not-allowed}
.notice{text-align:center;font-size:11px;color:#c6e2d6;margin-top:12px}
</style>
</head>
<body>
<main class="game">

 <div class="header">
  <span style="font-size:23px">ⓘ</span>
  <div class="balance">
   <span id="balance">1000.00</span> نقطة
   <span class="plus">+</span>
  </div>
  <span style="font-size:24px">›</span>
 </div>

 <div class="title">APPLE OF FORTUNE</div>

 <section class="board" id="board"></section>

 <div class="status" id="status">
  اضغط ابدأ الجولة، ثم اختار خانة من الصف السفلي.
 </div>

 <button class="action start" id="start">ابدأ الجولة</button>
 <button class="action cash" id="cash" disabled>خذ الأرباح</button>

 <div class="notice">
  نسخة تجريبية برصيد افتراضي فقط.
 </div>
</main>

<script>
const multipliers=[
 349.68,
 69.93,
 27.97,
 11.18,
 6.71,
 4.02,
 2.41,
 1.93
];

const board=document.getElementById("board");
const statusBox=document.getElementById("status");
const balanceBox=document.getElementById("balance");
const startButton=document.getElementById("start");
const cashButton=document.getElementById("cash");

let balance=1000;
let bet=10;
let playing=false;
let currentRow=7;
let currentWin=0;
let results=[];

function buildBoard(){
 board.innerHTML="";

 multipliers.forEach((multiplier,rowIndex)=>{
  const row=document.createElement("div");
  row.className="row";

  const label=document.createElement("div");
  label.className="mult";
  label.id="mult-"+rowIndex;
  label.textContent="×"+multiplier.toFixed(2);
  row.appendChild(label);

  for(let col=0;col<5;col++){
   const cell=document.createElement("button");
   cell.className="cell";
   cell.disabled=true;
   cell.setAttribute("aria-label",
     "الصف "+(rowIndex+1)+" الخانة "+(col+1)
   );

   cell.addEventListener("click",()=>{
    chooseCell(rowIndex,col);
   });

   row.appendChild(cell);
  }

  board.appendChild(row);
 });
}

function getCells(row){
 return [...board.children[row].querySelectorAll(".cell")];
}

function updateBalance(){
 balanceBox.textContent=balance.toFixed(2);
}

function highlightRow(row){
 document.querySelectorAll(".mult").forEach(label=>{
  label.classList.remove("active");
 });

 document.getElementById("mult-"+row).classList.add("active");
}

function generateResults(){
 results=[];

 for(let row=0;row<8;row++){
  // كل صف له نتيجة مستقلة يتم تحديدها قبل بدء الجولة.
  const outcomes=Array(5).fill(false);

  // عدد التفاحات السليمة يتغير من صف لآخر.
  const safeCount=1+Math.floor(Math.random()*3);
  const positions=[0,1,2,3,4];

  for(let i=positions.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [positions[i],positions[j]]=[positions[j],positions[i]];
  }

  for(let i=0;i<safeCount;i++){
   outcomes[positions[i]]=true;
  }

  results.push(outcomes);
 }
}

function startGame(){
 if(playing)return;

 if(balance<bet){
  statusBox.textContent="رصيد النقاط الافتراضية غير كافٍ.";
  return;
 }

 balance-=bet;
 updateBalance();

 generateResults();

 playing=true;
 currentRow=7;
 currentWin=0;

 document.querySelectorAll(".cell").forEach(cell=>{
  cell.className="cell";
  cell.textContent="";
  cell.disabled=true;
 });

 highlightRow(currentRow);

 getCells(currentRow).forEach(cell=>{
  cell.disabled=false;
 });

 startButton.disabled=true;
 cashButton.disabled=true;

 statusBox.textContent=
  "اختار خانة من الصف الأخضر. بعد الاختيار هيظهر الصف بالكامل.";
}

function revealRow(row){
 const cells=getCells(row);

 cells.forEach((cell,col)=>{
  cell.disabled=true;

  if(results[row][col]){
   cell.className="cell apple";
   cell.textContent="🍎";
  }else{
   cell.className="cell core";
   cell.innerHTML=`
   <svg viewBox="0 0 100 100" width="76%" height="76%"
        aria-label="تفاحة خاسرة">
    <path d="M50 25
     C39 14 27 19 29 35
     L36 66 Q39 80 50 83
     Q61 80 64 66 L71 35
     C73 19 61 14 50 25Z"
     fill="#f2e8ce" stroke="#cbb995" stroke-width="3"/>
    <path d="M39 35 L45 43 L39 50
     M61 35 L55 43 L61 50"
     fill="none" stroke="#a99677" stroke-width="4"
     stroke-linecap="round"/>
    <path d="M50 22 Q45 14 50 8"
     fill="none" stroke="#5c3820" stroke-width="5"
     stroke-linecap="round"/>
   </svg>`;
  }
 });
}

function revealWholeBoard(){
 for(let row=0;row<8;row++){
  revealRow(row);
 }

 document.querySelectorAll(".mult").forEach(label=>{
  label.classList.remove("active");
 });
}

function chooseCell(row,col){
 if(!playing||row!==currentRow)return;

 // اكشف الصف المختار بالكامل.
 revealRow(row);

 const isSafe=results[row][col];

 if(!isSafe){
  // عند الخسارة، اكشف جميع الصفوف.
  revealWholeBoard();

  playing=false;
  startButton.disabled=false;
  cashButton.disabled=true;

  statusBox.textContent=
   "انتهت الجولة! ظهرت نتائج جميع الصفوف. ابدأ جولة جديدة للتجربة.";

  return;
 }

 // الاختيار السليم لا ينهي الجولة ولا يجمع الأرباح تلقائياً.
 currentWin=bet*multipliers[row];

 if(row===0){
  balance+=currentWin;
  updateBalance();

  playing=false;
  startButton.disabled=false;
  cashButton.disabled=true;

  statusBox.textContent=
   "وصلت إلى أعلى صف! تمت إضافة النقاط الافتراضية إلى رصيدك.";

  return;
 }

 // انتقل إلى الصف الأعلى بعد الاختيار السليم.
 currentRow=row-1;
 highlightRow(currentRow);

 getCells(currentRow).forEach(cell=>{
  cell.disabled=false;
 });

 cashButton.disabled=false;

 statusBox.textContent=
  "اختيار سليم! الأرباح الافتراضية الحالية: "+
  currentWin.toFixed(2)+
  " نقطة. تقدر تجمعها أو تكمل للصف التالي.";
}

function cashOut(){
 if(!playing||currentWin<=0)return;

 balance+=currentWin;
 updateBalance();

 playing=false;
 startButton.disabled=false;
 cashButton.disabled=true;

 statusBox.textContent=
  "تم جمع "+currentWin.toFixed(2)+
  " نقطة افتراضية. تقدر تبدأ جولة جديدة.";
}

startButton.addEventListener("click",startGame);
cashButton.addEventListener("click",cashOut);

buildBoard();
updateBalance();
</script>
</body>
</html>
